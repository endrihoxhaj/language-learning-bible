<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblos</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Quicksand:wght@300..700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c8a328",
                        "primary-hover": "#6a8f4c", // From onboarding
                        "background-light": "#f8f7f6", // From splash
                        "background-dark": "#201d12",
                        "biblos-cream": "#FDF6E3",
                        "biblos-brown": "#5D4E37",
                        "biblos-gold": "#C9A227",
                        "biblos-text-light": "#7A6F5D",
                        "text-dark": "#3D3426", // From onboarding
                        "text-subtle": "#7A6F5D", // From onboarding
                        "icon-dark": "#5D4E37", // From onboarding
                        "accent-gold": "#C9A227", // From onboarding
                    },
                    fontFamily: {
                        "display": ["Newsreader", "serif"],
                        "sans-rounded": ["Quicksand", "sans-serif"],
                        "lexend": ["Lexend", "sans-serif"], // From onboarding
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"
                    },
                    backgroundImage: {
                        'paper-pattern': "url('https://www.transparenttextures.com/patterns/cream-paper.png')",
                    }
                },
            },
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-biblos-cream h-screen w-full overflow-hidden">
    <div id="app" class="h-full w-full"></div>
    <script src="js/router.js" type="module"></script>
    <script src="js/app.js" type="module"></script>
</body>
</html>
