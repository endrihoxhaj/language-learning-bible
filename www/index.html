<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBLOS</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Quicksand:wght@300..700&amp;family=Lexend:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c8a328", // Splash default
                        "primary-green": "#7b9f5b", // Home default
                        "background-light": "#FDF6E3",
                        "background-dark": "#191c16",
                        "biblos-cream": "#FDF6E3",
                        "biblos-brown": "#5D4E37",
                        "biblos-dark-brown": "#3D3426",
                        "biblos-gold": "#C9A227",
                        "biblos-text-light": "#7A6F5D",
                        "biblos-gray": "#7A6F5D",
                        "biblos-orange": "#E57C23",
                    },
                    fontFamily: {
                        "display": ["Newsreader", "serif"],
                        "sans-rounded": ["Quicksand", "sans-serif"],
                        "lexend": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "2rem", "full": "9999px"},
                    backgroundImage: {
                        'paper-pattern': "url('https://www.transparenttextures.com/patterns/cream-paper.png')",
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        body {
            min-height: 100vh;
            margin: 0;
        }
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-biblos-cream font-display antialiased text-biblos-brown">
    <div id="app"></div>
    <script src="js/controllers/main.js"></script>
    <script src="js/router.js"></script>
</body>
</html>
