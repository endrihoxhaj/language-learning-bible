<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBLOS Language App</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7b9f5b",
                        "biblos-cream": "#FDF6E3",
                        "biblos-brown": "#5D4E37",
                        "biblos-dark-brown": "#3D3426",
                        "biblos-gray": "#7A6F5D",
                        "biblos-orange": "#E57C23",
                        "background-light": "#FDF6E3",
                        "background-dark": "#191c16",
                        // Additional colors from profile page
                        "primary-green": "#6B9080",
                        "accent-gold": "#E9C46A",
                        "card-white": "#FFFFFF",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "sans": ["Nunito", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "1.25rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                },
            },
        }
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Global scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            background-color: #FDF6E3; /* biblos-cream */
        }
    </style>
</head>
<body class="bg-background-light text-biblos-dark-brown antialiased selection:bg-primary/30 overflow-hidden">

    <!-- App Container -->
    <div id="app-container" class="relative mx-auto h-full min-h-screen w-full max-w-md overflow-hidden bg-background-light shadow-2xl">
        <!-- Views will be loaded here -->
    </div>

    <!-- Scripts -->
    <script src="js/router.js"></script>
    <script src="js/lesson_controller.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Router.init();
        });
    </script>
</body>
</html>
