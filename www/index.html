<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BIBLOS</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Quicksand:wght@300..700&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c8a328", // Gold from splash
                        "primary-green": "#7b9f5b", // Green from dashboard
                        "background-light": "#f8f7f6",
                        "background-dark": "#201d12",
                        "biblos-cream": "#FDF6E3",
                        "biblos-brown": "#5D4E37",
                        "biblos-dark-brown": "#3D3426",
                        "biblos-gold": "#C9A227",
                        "biblos-text-light": "#7A6F5D",
                        "biblos-orange": "#E57C23",
                        "biblos-gray": "#7A6F5D",
                    },
                    fontFamily: {
                        "display": ["Newsreader", "serif"],
                        "sans-rounded": ["Quicksand", "sans-serif"],
                        "sans-modern": ["Lexend", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "2rem", "full": "9999px"},
                    backgroundImage: {
                        'paper-pattern': "url('https://www.transparenttextures.com/patterns/cream-paper.png')",
                    }
                },
            },
        }
    </script>

    <style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        body {
            overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
            -webkit-tap-highlight-color: transparent;
        }
        #app {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-biblos-cream text-biblos-brown antialiased">
    <div id="app">
        <!-- Views will be injected here -->
    </div>

    <!-- Lesson Controller -->
    <script src="js/lesson_controller.js"></script>
    <!-- Router Script -->
    <script src="js/router.js"></script>
    <!-- Main App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
