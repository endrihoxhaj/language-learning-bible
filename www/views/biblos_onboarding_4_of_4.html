<!DOCTYPE html>

<html class="light" lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BIBLOS Onboarding</title>
<!-- Fonts: Lexend (System), Material Symbols, Playfair Display & Nunito (User Request) -->
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=Nunito:wght@400;600;700&amp;family=Playfair+Display:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7BA05B", // Updated to user's requested green
                        "biblos-bg": "#FDF6E3",
                        "biblos-dark": "#3D3426",
                        "biblos-light": "#7A6F5D",
                        "biblos-dot": "#5D4E37",
                        "background-light": "#f7f7f6",
                        "background-dark": "#191d15",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                        "sans-soft": ["Nunito", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'card': '0 4px 20px -2px rgba(61, 52, 38, 0.05)',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased">
<!-- Main Container -->
<div class="relative flex h-full min-h-screen w-full flex-col bg-biblos-bg group/design-root overflow-x-hidden">
<!-- Header -->
<div class="flex items-center p-4 pt-12 pb-2 justify-between sticky top-0 z-10 bg-biblos-bg/95 backdrop-blur-sm">
<button class="text-biblos-dark hover:bg-black/5 rounded-full p-2 transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center justify-end">
<p class="text-biblos-light text-base font-bold leading-normal tracking-wide shrink-0 font-sans-soft">4 di 4</p>
</div>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 flex flex-col px-6 pb-24">
<!-- Hero Illustration -->
<div class="w-full flex justify-center py-4">
<div class="w-48 h-48 bg-center bg-no-repeat bg-contain" data-alt="Illustration of Saint Francis with a globe and birds in a peaceful sketch style" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC5GGa7zeedy_46j8Z0sCRry61jIvkZUVPYJGrGa8CHm8bWsIXOYfEziLzV9sszxgv9uTyYBO8QbTFyA_vCxNaqb-8DM2VzJYogsO_zML2gwvO3VyXafDO6GLG1wHBGhhil0Ywxf4ZOE1lOaAAmO6DvbfCrqOs4li2T3c2Z1OmFWzWfmf153l_WNUFlmLtUMdLHI9B2ts8NIV9crII2Kq7wOgUwWICr_ozjVPt0LnI1caXGrF0GNCAa98LSJ09GJNOKYlGGrZDkaso');">
</div>
</div>
<!-- Title Section -->
<div class="text-center mb-6">
<h2 class="text-biblos-dark text-[26px] font-bold leading-tight pb-2 font-serif">
                    Perché vuoi imparare?
                </h2>
<p class="text-biblos-light text-[14px] font-normal leading-normal font-sans-soft">
                    Puoi selezionare più opzioni
                </p>
</div>
<!-- Page Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 mb-8">
<div class="h-2 w-2 rounded-full bg-biblos-dot"></div>
<div class="h-2 w-2 rounded-full bg-biblos-dot"></div>
<div class="h-2 w-2 rounded-full bg-biblos-dot"></div>
<div class="h-2 w-2 rounded-full bg-biblos-dot"></div>
</div>
<!-- Selection Grid -->
<div class="grid grid-cols-2 gap-3 w-full max-w-md mx-auto">
<!-- Card 1: Viaggiare (Unselected) -->
<button class="relative bg-white rounded-2xl h-[140px] flex flex-col items-center justify-center p-4 shadow-card hover:bg-gray-50 transition-all border-2 border-transparent group">
<div class="w-10 h-10 flex items-center justify-center mb-3 text-gray-400 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[36px]">flight</span>
</div>
<span class="text-biblos-dark font-sans-soft font-bold text-base">Viaggiare</span>
</button>
<!-- Card 2: Lavoro (Selected) -->
<button class="relative bg-white rounded-2xl h-[140px] flex flex-col items-center justify-center p-4 shadow-card border-2 border-primary">
<!-- Checkmark Badge -->
<div class="absolute top-3 right-3 bg-primary rounded-full w-6 h-6 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-[16px] font-bold">check</span>
</div>
<div class="w-10 h-10 flex items-center justify-center mb-3 text-primary">
<span class="material-symbols-outlined text-[36px]">work</span>
</div>
<span class="text-biblos-dark font-sans-soft font-bold text-base">Lavoro</span>
</button>
<!-- Card 3: Missione (Selected) -->
<button class="relative bg-white rounded-2xl h-[140px] flex flex-col items-center justify-center p-4 shadow-card border-2 border-primary">
<!-- Checkmark Badge -->
<div class="absolute top-3 right-3 bg-primary rounded-full w-6 h-6 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-[16px] font-bold">check</span>
</div>
<div class="w-10 h-10 flex items-center justify-center mb-3 text-primary">
<span class="material-symbols-outlined text-[36px]">church</span>
</div>
<span class="text-biblos-dark font-sans-soft font-bold text-base">Missione</span>
</button>
<!-- Card 4: Cultura (Unselected) -->
<button class="relative bg-white rounded-2xl h-[140px] flex flex-col items-center justify-center p-4 shadow-card hover:bg-gray-50 transition-all border-2 border-transparent group">
<div class="w-10 h-10 flex items-center justify-center mb-3 text-gray-400 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[36px]">psychology</span>
</div>
<span class="text-biblos-dark font-sans-soft font-bold text-base">Cultura</span>
</button>
</div>
</div>
<!-- Sticky Footer CTA -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-biblos-bg via-biblos-bg to-transparent">
<button class="w-full bg-primary h-[56px] rounded-full flex items-center justify-center gap-2 shadow-lg hover:bg-opacity-90 active:scale-[0.98] transition-all transform">
<span class="text-white font-display font-bold text-lg tracking-wide uppercase">Inizia il Test</span>
<span class="material-symbols-outlined text-white">arrow_forward</span>
</button>
</div>
</div>
<script src="/js/router.js"></script>
<script src="/js/lesson_controller.js"></script>
</body></html>
