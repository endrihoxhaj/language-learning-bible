<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .font-nunito {
            font-family: 'Nunito', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<!-- Main Container for Phone Form Factor -->
<div class="relative w-full max-w-md mx-auto min-h-screen flex flex-col bg-biblos-cream dark:bg-background-dark transition-colors duration-200">
<!-- Status Bar Spacer (Simulated) -->
<div class="h-12 w-full shrink-0"></div>
<!-- Header -->
<header class="flex items-center justify-between px-6 py-2 shrink-0">
<button class="flex items-center justify-center size-10 -ml-2 text-[#111814] dark:text-white hover:bg-black/5 rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-[#111814] dark:text-white flex-1 text-center">
                Ripasso Vocabolario
            </h1>
<div class="flex items-center justify-end w-10">
<span class="text-base font-bold text-[#111814] dark:text-white/80">7/20</span>
</div>
</header>
<!-- Progress Bar -->
<div class="px-6 py-3 shrink-0">
<div class="w-full bg-biblos-border dark:bg-white/10 rounded-full h-3 overflow-hidden">
<div class="bg-primary h-full rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(43,238,121,0.4)]" style="width: 35%;"></div>
</div>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 flex flex-col px-6 pt-4 pb-6 overflow-y-auto">
<!-- Flashcard -->
<div class="w-full max-w-[340px] mx-auto bg-white dark:bg-gray-800 rounded-[20px] shadow-[0_12px_32px_-8px_rgba(0,0,0,0.1)] dark:shadow-none aspect-[4/3] min-h-[280px] flex flex-col items-center justify-center gap-6 relative z-10 p-6 transform hover:scale-[1.01] transition-transform duration-300">
<div class="text-[72px] leading-none drop-shadow-sm select-none animate-[bounce_2s_infinite]">🍞</div>
<p class="font-nunito text-base text-biblos-text-subtle dark:text-gray-300 font-medium text-center">
                    Come si dice in inglese?
                </p>
</div>
<!-- Answer Grid -->
<div class="mt-8 w-full max-w-[340px] mx-auto grid grid-cols-2 gap-3">
<!-- Option 1: Bread (Selected/Correct) -->
<button class="group relative h-[56px] w-full bg-primary/20 dark:bg-primary/10 border-2 border-primary rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 shadow-sm">
<span class="font-nunito font-bold text-base text-green-900 dark:text-primary">bread</span>
<span class="material-symbols-outlined text-green-700 dark:text-primary text-[20px] font-bold">check_circle</span>
</button>
<!-- Option 2: Wine -->
<button class="h-[56px] w-full bg-white dark:bg-gray-800 border border-biblos-border dark:border-gray-700 rounded-xl flex items-center justify-center transition-all hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 shadow-sm">
<span class="font-nunito font-bold text-base text-[#111814] dark:text-gray-200">wine</span>
</button>
<!-- Option 3: Water -->
<button class="h-[56px] w-full bg-white dark:bg-gray-800 border border-biblos-border dark:border-gray-700 rounded-xl flex items-center justify-center transition-all hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 shadow-sm">
<span class="font-nunito font-bold text-base text-[#111814] dark:text-gray-200">water</span>
</button>
<!-- Option 4: Cheese -->
<button class="h-[56px] w-full bg-white dark:bg-gray-800 border border-biblos-border dark:border-gray-700 rounded-xl flex items-center justify-center transition-all hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 shadow-sm">
<span class="font-nunito font-bold text-base text-[#111814] dark:text-gray-200">cheese</span>
</button>
</div>
<!-- Spacer to push footer down -->
<div class="flex-1 min-h-[40px]"></div>
<!-- Bottom Section: Stats & Mascot -->
<div class="flex items-end justify-between w-full mt-4">
<!-- Stats -->
<div class="flex flex-col gap-2 pb-2">
<div class="flex items-center gap-2 text-green-700 dark:text-primary">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
<span class="text-sm font-bold tracking-wide">7 corrette</span>
</div>
<div class="flex items-center gap-2 text-biblos-text-subtle dark:text-gray-400">
<span class="material-symbols-outlined text-[20px]">sync</span>
<span class="text-sm font-bold tracking-wide">2 da ripassare</span>
</div>
</div>
<!-- Mascot & Bubble -->
<div class="relative flex flex-col items-end animate-[fadeIn_0.5s_ease-out]">
<!-- Speech Bubble -->
<div class="bg-white dark:bg-gray-800 px-4 py-2 rounded-2xl rounded-br-sm shadow-md mb-2 mr-2 border border-gray-100 dark:border-gray-700 relative">
<p class="text-sm font-display font-bold text-[#111814] dark:text-white whitespace-nowrap">
                            Bravo! Continuiamo!
                        </p>
<!-- Triangle for speech bubble -->
<div class="absolute -bottom-[6px] right-4 w-3 h-3 bg-white dark:bg-gray-800 border-b border-r border-gray-100 dark:border-gray-700 transform rotate-45"></div>
</div>
<!-- Mascot Image -->
<div class="w-[60px] h-[60px] rounded-full border-4 border-white dark:border-gray-700 shadow-md overflow-hidden bg-gray-100 relative">

</div>
</div>
</div>
</div>
