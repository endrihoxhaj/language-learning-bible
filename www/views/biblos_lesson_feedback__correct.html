<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BIBLOS Lesson Feedback</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=Nunito:wght@400;600;700&amp;family=Playfair+Display:wght@400;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7b9f5b",
                        "background-light": "#f7f7f6",
                        "background-dark": "#191c16",
                        "biblos-cream": "#FAF8F1",
                        "biblos-gold": "#C9A227",
                        "biblos-brown-dark": "#3D3426",
                        "biblos-brown-med": "#5D4E37",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                        "body": ["Nunito", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom sparkle animation feel */
        .sparkle {
            position: absolute;
            opacity: 0.6;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-biblos-cream text-biblos-brown-dark font-display h-screen flex flex-col overflow-hidden">
<!-- Background Decor (Confetti/Sparkles) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<!-- Faint confetti particles -->
<div class="sparkle top-[15%] left-[10%] text-primary/30 rotate-12">
<span class="material-symbols-outlined text-sm">star</span>
</div>
<div class="sparkle top-[12%] right-[15%] text-biblos-gold/40 -rotate-12">
<span class="material-symbols-outlined text-xl">star</span>
</div>
<div class="sparkle top-[25%] left-[80%] text-primary/20 rotate-45">
<span class="material-symbols-outlined text-xs">circle</span>
</div>
<div class="sparkle top-[30%] left-[20%] text-biblos-gold/30">
<span class="material-symbols-outlined text-sm">pentagon</span>
</div>
<div class="sparkle top-[40%] right-[10%] text-primary/25 -rotate-45">
<span class="material-symbols-outlined text-lg">star</span>
</div>
</div>
<!-- Header -->
<div class="relative z-10 flex items-center justify-between p-4 pb-2">
<div class="flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-black/5 cursor-pointer text-biblos-brown-dark">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<!-- Progress Dots (Simplified for header) -->
<div class="flex gap-2">
<div class="h-2 w-2 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-black/10"></div>
</div>
<div class="flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-black/5 cursor-pointer text-biblos-brown-dark">
<span class="material-symbols-outlined">more_horiz</span>
</div>
</div>
<!-- Main Scrollable Content -->
<div class="flex-1 overflow-y-auto relative z-10 flex flex-col">
<!-- Tutor Section (Hero) -->
<div class="relative w-full flex flex-col items-center justify-end min-h-[35vh] pb-6">
<!-- XP Badge -->
<div class="absolute top-10 right-[15%] z-20 transform rotate-6 animate-pulse">
<div class="bg-biblos-gold text-white px-4 py-2 rounded-xl shadow-lg border-2 border-white/20 flex items-center gap-1">
<span class="font-bold text-lg tracking-wide">+15 XP</span>
<span class="text-sm">⭐</span>
</div>
</div>
<!-- Tutor Image -->
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Halo effect behind -->
<div class="absolute inset-0 bg-yellow-100/50 rounded-full blur-3xl scale-125"></div>
<!-- Character Image -->
<div class="w-full h-full bg-contain bg-center bg-no-repeat z-10 drop-shadow-xl" data-alt="Saint Francis smiling joyfully with arms raised, surrounded by birds and a glowing halo" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBnOFCiLRjDQFISzy9I8tAHUYysdSSWh9qCQjiNIJkoHTbr7L-ELRks-dNoNdvrSKFE5FMN3irt82VvqJb288mcjlLOqm-aqO31FEHcJmAo6jM5RXIYLMhHFhhiD3_4wwCh0xGkPlb_kGXUSUnXV7Z4UoII_Q9ljWVqVEeAtDQKLV-0rS-D5ylwZdZ5gRyY2eej6zlfgp5DLus-Jv8UwFZrzmsbUX_vuKZUPBjM008iQelOMZzLme-ctF2awbZ8T3wRHPBgYRffmzA');">
</div>
</div>
</div>
<!-- Content Section -->
<div class="px-5 pb-8 flex flex-col gap-6 w-full max-w-md mx-auto">
<!-- Feedback Card -->
<div class="bg-white rounded-2xl p-5 shadow-[0_4px_20px_rgba(0,0,0,0.05)] border-l-[6px] border-primary relative overflow-hidden">
<!-- Checkmark Badge -->
<div class="absolute top-4 right-4">
<span class="material-symbols-outlined text-primary text-3xl">check_circle</span>
</div>
<div class="flex flex-col gap-4">
<!-- Title & Message -->
<div>
<h2 class="font-serif text-3xl font-bold text-biblos-brown-dark mb-2">Perfetto!</h2>
<p class="font-body text-base text-biblos-brown-med leading-relaxed">
                            Excellent job, Marco! Your pronunciation was great!
                        </p>
</div>
<!-- User Response Box -->
<div class="bg-[#F5F5F5] rounded-lg p-4 flex flex-col gap-1 border border-black/5">
<span class="text-xs uppercase tracking-wider font-bold text-gray-400">Your answer</span>
<p class="font-body text-base text-biblos-brown-dark">
                            Yes, I would like some bread, please.
                        </p>
</div>
<!-- Validation Badges -->
<div class="flex flex-wrap gap-2 pt-1">
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">check</span>
<span class="text-xs font-bold font-body">Grammatica</span>
</div>
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">check</span>
<span class="text-xs font-bold font-body">Pronuncia</span>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Fixed Bottom Action -->
<div class="relative z-20 p-5 bg-gradient-to-t from-biblos-cream via-biblos-cream to-transparent pb-8">
<button class="w-full h-14 bg-primary hover:bg-[#6a8a4d] active:scale-[0.98] transition-all rounded-xl flex items-center justify-center gap-2 shadow-md shadow-primary/20">
<span class="text-white font-bold text-lg tracking-wide font-display">CONTINUA</span>
<span class="material-symbols-outlined text-white">arrow_forward</span>
</button>
</div>
<script src="/js/router.js"></script>
<script src="/js/lesson_controller.js"></script>
</body></html>
